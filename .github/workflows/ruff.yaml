name: Ruff
on:
  workflow_dispatch:
  push:
    paths:
      - 'ciscripts/**/*.py'
jobs:
  Ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "--version"
      - name: Run Ruff (check)
        run: ruff check --diff ciscripts
      - name: Run Ruff (format)
        run: ruff format --diff ciscripts
